<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="100" height="100" rx="22" fill="#030712"/>
  <rect width="94" height="94" x="3" y="3" rx="19" fill="url(#bgGlow)" stroke="#0284c7" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Stylized Cyber A -->
  <path d="M 50 16 L 24 76 L 36 76 L 43 58 L 57 58 L 64 76 L 76 76 Z M 50 34 L 54 49 L 46 49 Z" fill="none" stroke="url(#neonCyan)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Keyboard Key Indicator at bottom -->
  <rect x="36" y="66" width="28" height="7" rx="2" fill="none" stroke="#22d3ee" stroke-width="2"/>
  
  <!-- Energy Swoosh -->
  <path d="M 22 56 Q 50 48 78 38" fill="none" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round"/>
</svg>
